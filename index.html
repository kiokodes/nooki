<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nooki · Our Shared Nook</title>
    <!--
      Installed-app identity. `display: standalone` in the manifest is what makes iOS treat
      the site as a web app — and on iPhone and iPad that install is the precondition for
      web push (a Safari tab has no Push API at all). The Apple-specific tags below are what
      iOS reads for the icon, name and status bar; the manifest is what every other browser
      uses. Keep this block and nooki-sw.js in step with "Push notifications" in the README.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FAF6EE" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Nooki" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      Friendly rounded typography: Nunito / Quicksand, loaded *without* holding up the first
      paint. A stylesheet in the head is render-blocking, so on a phone it sat between the
      Home Screen icon and the splash: the OS launch screen, then a blank beat while Google
      answered, and only then the Nooki wordmark. `media="print"` takes the request off the
      critical path (the preconnects still warm the connection) and the fonts swap in when
      they arrive — the splash and the app both name system fallbacks, and `display=swap`
      keeps text visible throughout.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,700&family=Quicksand:wght@500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,700&family=Quicksand:wght@500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!--
      Boot splash: the animated splash must be on screen from the very first paint,
      but the real one lives inside the JavaScript bundle — and on a phone that bundle
      can take a while to download and parse, during which the page used to sit blank
      and the splash was effectively never seen. This copy is plain HTML/CSS, so it is
      already racing before any JavaScript arrives. It mirrors SplashScreen (same
      wordmark, same pink/green race, same colours from the design tokens); React
      replaces everything inside #root on mount, at which point the real splash takes
      over and plays its run in full. Keep the two in step when the design changes.
    -->
    <style>
      .nooki-boot {
        position: fixed;
        inset: 0;
        background-color: #F1EBE1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Quicksand', 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .nooki-boot-card {
        width: 100%;
        max-width: 390px;
        height: 100%;
        max-height: 844px;
        background-color: #FAF6EE;
        border-radius: 36px;
        box-shadow: 0 12px 30px rgba(78, 56, 44, 0.05);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        overflow: hidden;
        user-select: none;
      }
      @media (max-width: 480px) {
        .nooki-boot { background-color: #FAF6EE; }
        .nooki-boot-card {
          max-width: 100%;
          max-height: 100%;
          border-radius: 0;
          box-shadow: none;
        }
      }
      .nooki-boot-wordmark {
        font-size: 2.25rem;
        font-weight: 800;
        color: #372E29;
        letter-spacing: -0.02em;
        line-height: 1.1;
        animation: nooki-boot-pop 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      /* The couple themselves — the cover image of the app, on every launch. Same
         pop-in as the wordmark, mirrored by SplashScreen's data-splash-pair. */
      .nooki-boot-pair {
        height: 84px;
        width: auto;
        max-width: 42%;
        object-fit: contain;
        pointer-events: none;
        animation: nooki-boot-pop 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .nooki-boot-track {
        position: relative;
        width: 100%;
        height: 24px;
        overflow: hidden;
      }
      /* The race is carried by two full-width "runner" boxes, one per dot, animated with
         percentage transforms. A percentage in `translate` is a share of the runner's own
         width — which is the track's width — so 100% is exactly one track, with no
         container-query units and no measured pixels involved. That matters here: the phone
         is parsing the bundle while this race runs, container units are resolved on the main
         thread (the dots could sit through the whole race unmoved, and a browser without
         container queries could not resolve the distance at all), whereas a percentage
         transform is resolved once, off the main thread, on every browser that can animate a
         transform. The `scale` in the keyframes grows the dot about its own centre
         (`transform-origin`), exactly as before. Keep this in step with `.nooki-splash-*` in
         src/index.css. */
      .nooki-boot-runner {
        position: absolute;
        left: 0;
        width: 100%;
        height: 10px;
        transform-origin: 5px 50%;
        will-change: transform;
        animation-duration: 1.35s;
        animation-fill-mode: both;
      }
      .nooki-boot-runner--pink {
        top: 2px;
        animation-name: nooki-boot-race-pink;
        animation-timing-function: cubic-bezier(0.22, 0.82, 0.34, 1);
      }
      .nooki-boot-runner--green {
        top: 12px;
        animation-name: nooki-boot-race-green;
        animation-timing-function: cubic-bezier(0.46, 0.12, 0.2, 1);
        animation-delay: 0.1s;
      }
      .nooki-boot-dot {
        position: absolute;
        left: 0;
        top: 0;
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }
      .nooki-boot-dot--pink {
        background-color: #EC4899;
        box-shadow: 0 0 10px rgba(236, 72, 153, 0.45);
      }
      .nooki-boot-dot--green {
        background-color: #059669;
        box-shadow: 0 0 10px rgba(5, 150, 105, 0.4);
      }
      /* Only ever seen if the bundle is still on its way once the race is over: a quiet line
         instead of a frozen frame. */
      .nooki-boot-waiting {
        font-size: 0.78rem;
        color: #A89E96;
        opacity: 0;
        animation: nooki-boot-waiting 0.4s ease 2.2s both;
      }
      @keyframes nooki-boot-pop {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes nooki-boot-race-pink {
        0% { transform: translateX(calc(0% - 14px)) scale(0.85); }
        55% { transform: translateX(calc(58% + 0px)) scale(1.15); }
        100% { transform: translateX(calc(100% + 14px)) scale(0.95); }
      }
      @keyframes nooki-boot-race-green {
        0% { transform: translateX(calc(0% - 14px)) scale(0.85); }
        50% { transform: translateX(calc(44% + 0px)) scale(1.05); }
        100% { transform: translateX(calc(100% + 14px)) scale(1.1); }
      }
      @keyframes nooki-boot-waiting {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      /* No race for reduced-motion readers (a phone OS "reduce motion" / "remove animations"
         setting is exactly where a race reads as broken): the splash still appears, with both
         dots parked visibly under the wordmark. The waiting line is a fade, not motion, so it
         is left alone. */
      @media (prefers-reduced-motion: reduce) {
        .nooki-boot-wordmark,
        .nooki-boot-runner { animation: none !important; }
        .nooki-boot-runner { transform: none !important; }
        .nooki-boot-runner--pink { left: calc(50% - 16px) !important; }
        .nooki-boot-runner--green { left: calc(50% + 6px) !important; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="nooki-boot" data-boot-splash role="status" aria-label="Loading Nooki">
        <div class="nooki-boot-card">
          <img class="nooki-boot-pair" src="/assets/nooki/boot-pair.png" alt="" width="88" height="84" />
          <span class="nooki-boot-wordmark">Nooki</span>
          <div class="nooki-boot-track" aria-hidden="true">
            <span class="nooki-boot-runner nooki-boot-runner--pink">
              <span class="nooki-boot-dot nooki-boot-dot--pink"></span>
            </span>
            <span class="nooki-boot-runner nooki-boot-runner--green">
              <span class="nooki-boot-dot nooki-boot-dot--green"></span>
            </span>
          </div>
          <span class="nooki-boot-waiting">Waking up your nook…</span>
        </div>
      </div>
    </div>
    <script>
      // The race above started with this page, before the bundle arrived. Recording when it
      // began lets the React splash carry the same run on instead of playing a second one;
      // see src/lib/bootRace.ts (the marker name is repeated there and guarded by a test).
      try {
        window.__nookiBootRace = {
          startedAt: typeof performance !== 'undefined' && performance.now ? performance.now() : Date.now(),
        };
      } catch (error) {
        // No marker: the React splash plays the whole race, exactly as it did before.
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
